<ion-header>
  <ion-toolbar>
    <ion-title>Ablaufplan teilen</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <div class="ion-padding-horizontal ion-padding-top">
    <ion-segment [value]="scope" (ionChange)="scope = $any($event).detail.value">
      <ion-segment-button value="one">
        <ion-label>Nur {{ currentLabel }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="all">
        <ion-label>Alle {{ planCount }} Pläne</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <ion-list [inset]="true">
    <ion-item button detail="false" (click)="choose('pdf')">
      <ion-icon name="document-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Exportieren (PDF)</ion-label>
    </ion-item>
    <ion-item button detail="false" [lines]="hasChatId ? 'full' : 'none'" (click)="choose('pdf2x')">
      <ion-icon name="documents-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Exportieren (PDF 2x A5)</ion-label>
    </ion-item>
    @if (hasChatId) {
      <ion-item button detail="false" (click)="choose('telegram')">
        <ion-icon name="paper-plane-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Per Telegram senden (PDF)</ion-label>
      </ion-item>
      <ion-item button detail="false" [lines]="scope === 'one' ? 'full' : 'none'" (click)="choose('telegram2x')">
        <ion-icon name="paper-plane-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Per Telegram senden (PDF 2x A5)</ion-label>
      </ion-item>
      @if (scope === 'one') {
        <ion-item button detail="false" lines="none" (click)="choose('telegramImage')">
          <ion-icon name="image-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Per Telegram senden (Bild)</ion-label>
        </ion-item>
      }
    }
  </ion-list>
</ion-content>

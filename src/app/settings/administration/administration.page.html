<ion-header translucent="true">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/tabs/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Administration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="light">
      <ion-title size="large">Administration</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-list-header><ion-label>Auswertung</ion-label></ion-list-header>
    <ion-item-group>
      <ion-item button detail="true" routerLink="/tabs/dashboard">
        <ion-icon name="analytics-outline" slot="start"></ion-icon>
        <ion-label>Usage Dashboard</ion-label>
      </ion-item>
    </ion-item-group>

    <ion-list-header><ion-label>Instanz: {{ db.tenant()?.longName }}</ion-label></ion-list-header>
    <ion-item-group>
      <ion-item>
        <ion-toggle
          helperText="Schaltet die Dateiablage für diese Instanz frei. Zugriff haben Admins, Verantwortliche und Helfer."
          [disabled]="isSaving"
          [(ngModel)]="filesEnabled" (ionChange)="saveFiles()">Dateiablage</ion-toggle>
      </ion-item>
      @if (filesEnabled) {
        <ion-item>
          <ion-toggle
            helperText="Alle Mitglieder außer Bewerber können die Dateiablage lesen. Hochladen bleibt Admins und Verantwortlichen vorbehalten."
            [disabled]="isSaving"
            [(ngModel)]="filesShared" (ionChange)="saveFiles()">Dateiablage für alle Mitglieder</ion-toggle>
        </ion-item>
      }
    </ion-item-group>
  </ion-list>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>Erinnerung versenden</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="intro">
    <p>Die Erinnerung wird per App-Benachrichtigung und per E-Mail verschickt. Betreff und Nachricht können frei angepasst werden.</p>
  </div>

  <ion-list lines="full" class="reminder-list">
    <ion-item>
      <ion-textarea autocapitalize="words"
        label="Betreff"
        labelPlacement="stacked"
        [(ngModel)]="title"
        [autoGrow]="true"
        rows="2"
        placeholder="z. B. 🔔 Erinnerung: Probe am 01.09.2026">
      </ion-textarea>
    </ion-item>
    <ion-item>
      <ion-textarea autocapitalize="words"
        label="Nachricht"
        labelPlacement="stacked"
        [(ngModel)]="message"
        [autoGrow]="true"
        rows="3"
        placeholder="Nachrichtentext">
      </ion-textarea>
    </ion-item>
  </ion-list>

  @if (attendanceLink) {
  <ion-list lines="none" class="reminder-list">
    <ion-item>
      <ion-icon slot="start" name="link-outline" color="medium"></ion-icon>
      <ion-label>
        <p>Link in der E-Mail</p>
        <p><a [href]="attendanceLink" target="_blank">{{ attendanceLink }}</a></p>
      </ion-label>
    </ion-item>
  </ion-list>
  }

  <div class="actions">
    <ion-button expand="block" fill="solid" color="primary" (click)="send()" [disabled]="!title.trim() && !message.trim()">
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      Versenden
    </ion-button>
  </div>
</ion-content>

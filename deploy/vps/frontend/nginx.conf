# Attendix frontend (www/) behind Traefik. Mirrors the headers and SPA
# rewrite from vercel.json.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Teams embeds the app in an iframe.
    add_header Content-Security-Policy "frame-ancestors 'self' *.cloud.microsoft teams.microsoft.com *.teams.microsoft.com *.microsoft365.com *.office.com *.skype.com *.teams.microsoft.us *.gov.teams.microsoft.us local.teams.office.com;" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Service worker files must never be cached.
    location ~ ^/(ngsw-worker|safety-worker|worker-basic\.min)\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' *.cloud.microsoft teams.microsoft.com *.teams.microsoft.com *.microsoft365.com *.office.com *.skype.com *.teams.microsoft.us *.gov.teams.microsoft.us local.teams.office.com;" always;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'self' *.cloud.microsoft teams.microsoft.com *.teams.microsoft.com *.microsoft365.com *.office.com *.skype.com *.teams.microsoft.us *.gov.teams.microsoft.us local.teams.office.com;" always;
    }

    location /svg/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
